<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- Desktop width so Razorpay Standard Checkout shows UPI QR (evuddy.com laptop), not PhonePe intent. -->
  <meta name="viewport" content="width=1280, initial-scale=0.28, maximum-scale=1" />
  <style>
    html, body { margin: 0; padding: 16px; background: #F6FFF9; font-family: sans-serif; color: #0F172A; width: 1280px; min-height: 800px; }
    p { color: #64748B; }
  </style>
  <script>
    (function forceDesktop() {
      var w = 1280, h = 800;
      var ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
      function def(obj, key, val) {
        try {
          Object.defineProperty(obj, key, { configurable: true, get: function () { return val; } });
        } catch (e) {}
      }
      def(window, "innerWidth", w);
      def(window, "innerHeight", h);
      def(window, "outerWidth", w);
      def(window, "outerHeight", h);
      def(screen, "width", w);
      def(screen, "height", h);
      def(screen, "availWidth", w);
      def(screen, "availHeight", h);
      try { def(navigator, "userAgent", ua); } catch (e) {}
      try { def(navigator, "platform", "Win32"); } catch (e) {}
      try { def(navigator, "maxTouchPoints", 0); } catch (e) {}
      try { def(navigator, "vendor", "Google Inc."); } catch (e) {}
      window.matchMedia = function (query) {
        var q = String(query || "").toLowerCase();
        var mobile = /max-width|pointer:\s*coarse|hover:\s*none|only screen and \(max/.test(q);
        var desktop = /min-width|pointer:\s*fine|hover:\s*hover/.test(q);
        var matches = desktop ? true : mobile ? false : false;
        return {
          matches: matches,
          media: query,
          onchange: null,
          addListener: function () {},
          removeListener: function () {},
          addEventListener: function () {},
          removeEventListener: function () {},
          dispatchEvent: function () { return false; }
        };
      };
    })();
  </script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <p>Opening EVUDDY Razorpay checkout… scan the QR like evuddy.com (Shubhrax Mobility Limited).</p>
  <script>
    function post(obj) {
      var msg = JSON.stringify(obj);
      if (window.PayBridge && window.PayBridge.postMessage) {
        window.PayBridge.postMessage(msg);
      }
    }
    function openPay(raw) {
      var n = typeof raw === "string" ? JSON.parse(raw) : raw;
      if (typeof Razorpay === "undefined") {
        post({ type: "failed", message: "Razorpay checkout.js did not load. Check network." });
        return;
      }
      // Same fields as evuddy.com BikeBooking, plus desktop UPI QR (not PhonePe intent).
      var options = {
        key: n.key,
        amount: n.amount,
        currency: n.currency || "INR",
        name: n.name || "EVUDDY",
        image: n.image,
        description: n.description || "Booking Payment",
        order_id: n.order_id,
        prefill: n.prefill || {},
        notes: n.notes || {},
        theme: { color: "#18B368" },
        one_click_checkout: false,
        remember_customer: false,
        upi: { flow: "qr" },
        method: { netbanking: true, card: true, upi: true, wallet: false, emi: false, paylater: false },
        config: {
          display: {
            hide: [
              { method: "wallet" },
              { method: "paylater" },
              { method: "emi" }
            ],
            preferences: { show_default_blocks: true }
          }
        },
        handler: function (response) {
          post({
            type: "success",
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature
          });
        },
        modal: {
          ondismiss: function () { post({ type: "dismiss" }); }
        }
      };
      try {
        var rzp = new Razorpay(options);
        rzp.on("payment.failed", function (resp) {
          post({
            type: "failed",
            message: (resp && resp.error && (resp.error.description || resp.error.reason)) || "Payment failed."
          });
        });
        rzp.open();
      } catch (e) {
        post({ type: "failed", message: String(e.message || e) });
      }
    }
    function markReady() {
      post({ type: "ready" });
    }
    if (typeof Razorpay !== "undefined") {
      markReady();
    } else {
      window.addEventListener("load", function () {
        if (typeof Razorpay === "undefined") {
          post({ type: "failed", message: "Razorpay checkout.js did not load." });
        } else {
          markReady();
        }
      });
    }
  </script>
</body>
</html>
