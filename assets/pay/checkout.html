<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0F172A;
    }
    #hint {
      padding: 28px 22px;
      color: #64748B;
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <p id="hint">Opening secure Razorpay checkout — same as evuddy.com…</p>
  <script>
    function post(obj) {
      var msg = JSON.stringify(obj);
      if (window.PayBridge && window.PayBridge.postMessage) {
        window.PayBridge.postMessage(msg);
      }
    }
    (function () {
      var nativeOpen = window.open.bind(window);
      window.open = function (url, target, features) {
        var u = url == null ? "" : String(url);
        var lower = u.toLowerCase();
        if (
          lower.indexOf("upi:") === 0 ||
          lower.indexOf("tez:") === 0 ||
          lower.indexOf("gpay:") === 0 ||
          lower.indexOf("phonepe:") === 0 ||
          lower.indexOf("paytmmp:") === 0 ||
          lower.indexOf("bhim:") === 0 ||
          lower.indexOf("intent:") === 0
        ) {
          post({ type: "open", url: u });
        }
        // Continue / 3DS / QR use a real window (about:blank or https).
        // A fake window makes Razorpay's Continue button do nothing.
        return nativeOpen(url, target, features);
      };
    })();
    function hint(text) {
      var el = document.getElementById("hint");
      if (el) el.textContent = text;
    }
    function sheet(options) {
      if (typeof Razorpay === "undefined") {
        post({ type: "failed", message: "Razorpay checkout.js did not load. Check network." });
        return;
      }
      hint("Razorpay is open. Use UPI, card or netbanking — same as evuddy.com.");
      var rzp = new Razorpay(options);
      rzp.on("payment.failed", function (resp) {
        post({
          type: "failed",
          message: (resp && resp.error && (resp.error.description || resp.error.reason)) || "Payment failed."
        });
      });
      rzp.open();
    }
    function checkoutOptions(n, extra) {
      extra = extra || {};
      var options = {
        key: extra.key || n.key,
        amount: extra.amount || n.amount,
        currency: extra.currency || n.currency || "INR",
        name: extra.name || n.name || "EVUDDY",
        image: extra.image || n.image || "https://www.evuddy.com/Evuddy-logo-dark-E.png",
        description: "Booking Payment - " + (n.bookingId || ""),
        prefill: n.prefill || {},
        notes: n.notes || {},
        theme: { color: "#18B368" },
        modal: {
          ondismiss: function () { post({ type: "dismiss" }); }
        },
        handler: function (response) {
          post({
            type: "success",
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature
          });
        }
      };
      var orderId = extra.order_id || extra.orderId || n.order_id || n.orderId || "";
      if (String(orderId).indexOf("order_") === 0) options.order_id = orderId;
      return options;
    }
    // Fallback only: POST create-order, then Razorpay.open — same as Book EV.
    async function payLikeBookEv(n) {
      hint("Creating Razorpay order...");
      try {
        var ac = typeof AbortController !== "undefined" ? new AbortController() : null;
        var timer = ac ? setTimeout(function () { ac.abort(); }, 25000) : null;
        var r = await fetch("https://www.evuddy.com/api/razorpay/create-order", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + n.token
          },
          body: JSON.stringify({
            bookingMongoId: n.bookingMongoId,
            amount: n.rupees,
            firebaseIdToken: n.token
          }),
          signal: ac ? ac.signal : undefined
        });
        if (timer) clearTimeout(timer);
        var i = await r.json();
        if (!i.success) {
          post({ type: "failed", message: i.message || "Unable to create Razorpay order." });
          return;
        }
        if (i.paidWithWallet) {
          post({ type: "wallet" });
          return;
        }
        var remaining = Number(i.remainingAmount || i.pendingAmount || 0);
        var key = i.keyId || n.key;
        var amount = i.amount || n.amount || Math.round(Number(n.rupees) * 100);
        var orderId = i.orderId || "";
        var hasOrder = String(orderId).indexOf("order_") === 0;
        if (!hasOrder) {
          if (i.alreadyCaptured && remaining <= 0.009) {
            post({ type: "already_paid", message: i.message || "" });
            return;
          }
          post({
            type: "failed",
            message: i.message || "Could not open Razorpay. Please try again."
          });
          return;
        }
        if (!key || String(key).indexOf("rzp_") !== 0) {
          post({ type: "failed", message: "evuddy.com did not return a Razorpay key." });
          return;
        }
        sheet(checkoutOptions(n, {
          key: key,
          amount: amount,
          currency: i.currency,
          name: i.name,
          image: i.image,
          order_id: orderId
        }));
      } catch (e) {
        post({ type: "failed", message: String((e && e.message) || e || "Could not open Razorpay. Please try again.") });
      }
    }
    function openPay(raw) {
      var n = typeof raw === "string" ? JSON.parse(raw) : raw;
      try {
        var existing = n.order_id || n.orderId || "";
        // Website Book EV: create-order already ran. Open Standard Checkout with that order_id.
        if (String(existing).indexOf("order_") === 0 && n.key && String(n.key).indexOf("rzp_") === 0) {
          sheet(checkoutOptions(n, { order_id: existing }));
          return;
        }
        if (n.token && n.bookingMongoId) {
          payLikeBookEv(n);
          return;
        }
        sheet(checkoutOptions(n, {}));
      } catch (e) {
        post({ type: "failed", message: String(e.message || e) });
      }
    }
    function markReady() { post({ type: "ready" }); }
    if (typeof Razorpay !== "undefined") {
      markReady();
    } else {
      window.addEventListener("load", function () {
        if (typeof Razorpay === "undefined") {
          post({ type: "failed", message: "Razorpay checkout.js did not load." });
        } else {
          markReady();
        }
      });
    }
  </script>
</body>
</html>
