<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0F172A;
    }
    #hint {
      padding: 28px 22px;
      color: #64748B;
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <p id="hint">Opening secure Razorpay checkout — same as evuddy.com…</p>
  <script>
    function post(obj) {
      var msg = JSON.stringify(obj);
      if (window.PayBridge && window.PayBridge.postMessage) {
        window.PayBridge.postMessage(msg);
      }
    }
    // Continue / UPI / 3DS call window.open. Without this, Continue does nothing in the app WebView.
    window.open = function (url) {
      if (url) post({ type: "open", url: String(url) });
      return {
        closed: false,
        close: function () {},
        focus: function () {},
        location: { href: url || "" }
      };
    };
    function openPay(raw) {
      var n = typeof raw === "string" ? JSON.parse(raw) : raw;
      if (typeof Razorpay === "undefined") {
        post({ type: "failed", message: "Razorpay checkout.js did not load. Check network." });
        return;
      }
      var hint = document.getElementById("hint");
      if (hint) hint.textContent = "Razorpay is open. Use UPI, card or netbanking — same as evuddy.com.";
      var options = {
        key: n.key,
        amount: n.amount,
        currency: n.currency || "INR",
        name: n.name || "EVUDDY",
        description: n.description || "Booking Payment",
        order_id: n.order_id,
        image: n.image || "https://www.evuddy.com/Evuddy-logo-dark-E.png",
        prefill: n.prefill || {},
        notes: n.notes || {},
        theme: { color: "#18B368" },
        retry: { enabled: true, max_count: 4 },
        modal: {
          ondismiss: function () { post({ type: "dismiss" }); },
          confirm_close: true,
          animation: true
        },
        handler: function (response) {
          post({
            type: "success",
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature
          });
        }
      };
      try {
        var rzp = new Razorpay(options);
        rzp.on("payment.failed", function (resp) {
          post({
            type: "failed",
            message: (resp && resp.error && (resp.error.description || resp.error.reason)) || "Payment failed."
          });
        });
        rzp.open();
      } catch (e) {
        post({ type: "failed", message: String(e.message || e) });
      }
    }
    function markReady() { post({ type: "ready" }); }
    if (typeof Razorpay !== "undefined") {
      markReady();
    } else {
      window.addEventListener("load", function () {
        if (typeof Razorpay === "undefined") {
          post({ type: "failed", message: "Razorpay checkout.js did not load." });
        } else {
          markReady();
        }
      });
    }
  </script>
</body>
</html>
