<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style>
    html, body { margin: 0; padding: 24px; background: #F6FFF9; font-family: sans-serif; color: #0F172A; }
    p { color: #64748B; }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <p>Opening Shubhrax Mobility Limited UPI QR…</p>
  <script>
    function post(obj) {
      var msg = JSON.stringify(obj);
      if (window.PayBridge && window.PayBridge.postMessage) {
        window.PayBridge.postMessage(msg);
      }
    }
    function openPay(raw) {
      var n = typeof raw === "string" ? JSON.parse(raw) : raw;
      if (typeof Razorpay === "undefined") {
        post({ type: "failed", message: "Razorpay checkout.js did not load. Check network." });
        return;
      }
      // Website Standard Checkout (checkout.js). UPI QR only — no Magic Checkout,
      // PhonePe intent list, cards, wallets or netbanking.
      var options = {
        key: n.key,
        amount: n.amount,
        currency: n.currency || "INR",
        name: n.name || "Shubhrax Mobility Limited",
        image: n.image,
        description: n.description || "Booking Payment",
        order_id: n.order_id,
        prefill: Object.assign({ method: "upi" }, n.prefill || {}),
        notes: n.notes || {},
        theme: { color: "#18B368" },
        one_click_checkout: false,
        remember_customer: false,
        method: {
          upi: true,
          card: false,
          netbanking: false,
          wallet: false,
          emi: false,
          paylater: false
        },
        config: {
          display: {
            hide: [
              { method: "card" },
              { method: "netbanking" },
              { method: "wallet" },
              { method: "emi" },
              { method: "paylater" }
            ],
            blocks: {
              utib: {
                name: "Pay using UPI QR",
                instruments: [{ method: "upi", flows: ["qr"] }]
              }
            },
            sequence: ["block.utib"],
            preferences: { show_default_blocks: false }
          }
        },
        handler: function (response) {
          post({
            type: "success",
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature
          });
        },
        modal: {
          ondismiss: function () { post({ type: "dismiss" }); },
          confirm_close: true
        }
      };
      try {
        var rzp = new Razorpay(options);
        rzp.on("payment.failed", function (resp) {
          post({
            type: "failed",
            message: (resp && resp.error && (resp.error.description || resp.error.reason)) || "Payment failed."
          });
        });
        rzp.open();
      } catch (e) {
        post({ type: "failed", message: String(e.message || e) });
      }
    }
    function markReady() {
      post({ type: "ready" });
    }
    if (typeof Razorpay !== "undefined") {
      markReady();
    } else {
      window.addEventListener("load", function () {
        if (typeof Razorpay === "undefined") {
          post({ type: "failed", message: "Razorpay checkout.js did not load." });
        } else {
          markReady();
        }
      });
    }
  </script>
</body>
</html>
