<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0F172A;
    }
    #hint {
      padding: 28px 22px;
      color: #64748B;
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <p id="hint">Opening secure Razorpay checkout — same as evuddy.com…</p>
  <script>
    function post(obj) {
      var msg = JSON.stringify(obj);
      if (window.PayBridge && window.PayBridge.postMessage) {
        window.PayBridge.postMessage(msg);
      }
    }
    window.open = function (url) {
      if (url) post({ type: "open", url: String(url) });
      return {
        closed: false,
        close: function () {},
        focus: function () {},
        location: { href: url || "" }
      };
    };
    function hint(text) {
      var el = document.getElementById("hint");
      if (el) el.textContent = text;
    }
    function sheet(options) {
      if (typeof Razorpay === "undefined") {
        post({ type: "failed", message: "Razorpay checkout.js did not load. Check network." });
        return;
      }
      hint("Razorpay is open. Use UPI, card or netbanking — same as evuddy.com.");
      var rzp = new Razorpay(options);
      rzp.on("payment.failed", function (resp) {
        post({
          type: "failed",
          message: (resp && resp.error && (resp.error.description || resp.error.reason)) || "Payment failed."
        });
      });
      rzp.open();
    }
    // Same as live Book EV: POST create-order, then Razorpay.open with order_id.
    async function payLikeBookEv(n) {
      hint("Creating Razorpay order...");
      try {
      var r = await fetch("https://www.evuddy.com/api/razorpay/create-order", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + n.token
        },
        body: JSON.stringify({
          bookingMongoId: n.bookingMongoId,
          amount: n.rupees,
          firebaseIdToken: n.token
        })
      });
      var i = await r.json();
      if (!i.success) {
        post({ type: "failed", message: i.message || "Unable to create Razorpay order." });
        return;
      }
      if (i.paidWithWallet) {
        post({ type: "wallet" });
        return;
      }
      var remaining = Number(i.remainingAmount || i.pendingAmount || 0);
      var key = i.keyId || n.key;
      var amount = i.amount || n.amount || Math.round(Number(n.rupees) * 100);
      var orderId = i.orderId || n.order_id || "";
      var hasOrder = String(orderId).indexOf("order_") === 0;
      if (!hasOrder) {
        if (i.alreadyCaptured && remaining <= 0.009) {
          post({ type: "already_paid", message: i.message || "" });
          return;
        }
        post({
          type: "failed",
          message:
            "evuddy.com did not create a Razorpay order for this amount (alreadyCaptured, remaining ₹" +
            remaining +
            "). Live create-order must mint a new order after the first ₹1 — then tap Pay again."
        });
        return;
      }
      if (!key || String(key).indexOf("rzp_") !== 0) {
        post({ type: "failed", message: "evuddy.com did not return a Razorpay key." });
        return;
      }
      var options = {
        key: key,
        amount: amount,
        currency: i.currency || n.currency || "INR",
        name: i.name || "EVUDDY",
        image: i.image || "https://www.evuddy.com/Evuddy-logo-dark-E.png",
        description: "Booking Payment - " + (n.bookingId || ""),
        order_id: orderId,
        prefill: n.prefill || {},
        notes: n.notes || {},
        theme: { color: "#18B368" },
        retry: { enabled: true, max_count: 4 },
        modal: {
          ondismiss: function () { post({ type: "dismiss" }); },
          confirm_close: true,
          animation: true
        },
        handler: function (response) {
          post({
            type: "success",
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature
          });
        }
      };
      sheet(options);
      } catch (e) {
        post({ type: "failed", message: String(e.message || e) });
      }
    }
    function openPay(raw) {
      var n = typeof raw === "string" ? JSON.parse(raw) : raw;
      try {
        if (n.token && n.bookingMongoId) {
          payLikeBookEv(n);
          return;
        }
        var options = {
          key: n.key,
          amount: n.amount,
          currency: n.currency || "INR",
          name: n.name || "EVUDDY",
          description: n.description || "Booking Payment",
          image: n.image || "https://www.evuddy.com/Evuddy-logo-dark-E.png",
          prefill: n.prefill || {},
          notes: n.notes || {},
          theme: { color: "#18B368" },
          retry: { enabled: true, max_count: 4 },
          modal: {
            ondismiss: function () { post({ type: "dismiss" }); },
            confirm_close: true,
            animation: true
          },
          handler: function (response) {
            post({
              type: "success",
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            });
          }
        };
        if (n.order_id) options.order_id = n.order_id;
        sheet(options);
      } catch (e) {
        post({ type: "failed", message: String(e.message || e) });
      }
    }
    function markReady() { post({ type: "ready" }); }
    if (typeof Razorpay !== "undefined") {
      markReady();
    } else {
      window.addEventListener("load", function () {
        if (typeof Razorpay === "undefined") {
          post({ type: "failed", message: "Razorpay checkout.js did not load." });
        } else {
          markReady();
        }
      });
    }
  </script>
</body>
</html>
