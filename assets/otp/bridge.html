<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      overflow: auto;
    }
    #recaptcha {
      min-height: 1px;
    }
    iframe, .grecaptcha-badge {
      z-index: 2147483646 !important;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
  <div id="recaptcha"></div>
  <script>
    try {
      window.chrome = window.chrome || { runtime: {} };
    } catch (e) {}
    firebase.initializeApp({
      apiKey: "AIzaSyBlwZI_QVvI3mnEs1sgtIS_YQvpp5rU8Gk",
      authDomain: "kebuone-otp.firebaseapp.com",
      projectId: "kebuone-otp",
      storageBucket: "kebuone-otp.firebasestorage.app",
      messagingSenderId: "548462513436",
      appId: "1:548462513436:web:21cbd32f00c8a892a93ed9"
    });
    var confirmation = null;
    var verifier = null;
    var smsAbort = null;
    function post(obj) {
      if (window.OtpBridge && window.OtpBridge.postMessage) {
        window.OtpBridge.postMessage(JSON.stringify(obj));
      }
    }
    function listenSms() {
      try {
        if (!window.OTPCredential) return;
        if (smsAbort) { try { smsAbort.abort(); } catch (e) {} }
        smsAbort = new AbortController();
        navigator.credentials.get({
          otp: { transport: ["sms"] },
          signal: smsAbort.signal
        }).then(function (otp) {
          if (otp && otp.code) post({ type: "sms", code: String(otp.code) });
        }).catch(function () {});
      } catch (e) {}
    }
    function sendOtp(phone) {
      if (!verifier) {
        post({ type: "error", message: "Security check is still loading. Wait a moment and retry." });
        return;
      }
      listenSms();
      firebase.auth().signInWithPhoneNumber(phone, verifier)
        .then(function (c) { confirmation = c; post({ type: "sent" }); listenSms(); })
        .catch(function (e) {
          post({ type: "error", message: String(e.message || e) });
          remount();
        });
    }
    function confirmOtp(code) {
      if (!confirmation) { post({ type: "error", message: "Request a new OTP first." }); return; }
      confirmation.confirm(code)
        .then(function (res) {
          return res.user.getIdToken(true).then(function (token) {
            post({
              type: "verified",
              uid: res.user.uid,
              token: token,
              refreshToken: res.user.refreshToken || ""
            });
          });
        })
        .catch(function (e) { post({ type: "error", message: String(e.message || e) }); });
    }
    function remount() {
      try { if (verifier) verifier.clear(); } catch (e) {}
      var box = document.getElementById("recaptcha");
      if (box) box.innerHTML = "";
      mount();
    }
    function mount() {
      try {
        verifier = new firebase.auth.RecaptchaVerifier("recaptcha", {
          size: "invisible",
          callback: function () { post({ type: "captcha" }); },
          "expired-callback": function () { post({ type: "expired" }); }
        });
        verifier.render().then(function () { post({ type: "ready" }); })
          .catch(function (e) { post({ type: "error", message: String(e.message || e) }); });
      } catch (e) {
        post({ type: "error", message: String(e.message || e) });
      }
    }
    mount();
  </script>
</body>
</html>
